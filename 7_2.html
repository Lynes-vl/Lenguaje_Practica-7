<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
           font-weight: bold;
           font-size: x-large; 
        }
        .marca:link{
            color: yellow;
        }

        .marca:hover {
            color: green;
        }
        .as:link{
            color: purple;
        }

        .as:hover {
            color: red;
        }
    </style>
</head>
<body>
    <p>Enlaces. link and hover</p>
    <p><a href="https://www.marca.com/" class="marca">Ir a Marca</a></p>
    <p><a href="https://as.com/" class="as">Ir a AS</a></p>
</body>
</html>
