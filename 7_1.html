<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .verde_sub{
            color: green;
            text-decoration: underline;
        }
        .rojo{
            color: red;
        }
        .azul{
            color: blue;
        }
        .rojo_sub{
            color: red;
            text-decoration: underline;
        }
        .sub{
            text-decoration: underline overline;
        }
        .grande{
            font-weight: bold;
            font-size: xx-large;
        }
    </style>
</head>
<body>
    <p>En el momento en que <span class="verde_sub">entiendo verdaderamente</span> a mi <span class="rojo" >enemigo</span>
        , en el momento en que le <span class="sub">entiendo</span> lo<br>
    suficientemente bien como para <span class="grande">derrotarle</span>, entonces, en ese preciso instante,<br>
    <span class="azul">también le</span> <span class="rojo_sub">quiero</span></p>
</body>
</html>
