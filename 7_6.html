<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            width: 150px;
        }

        li {
            margin-bottom: 3px;
        }

        li a {
            display: block;
            background-color: blue;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 3px 0;
            border: 2px solid transparent;
        }

        li a:hover, li a:focus {
            border: 2px solid red;
            outline: none;
        }
    </style>
</head>
<body>
    <h1>Universidad de Alicante</h1>
    <ul>
        <li><a href="https://web.ua.es/es/ua-presentacion/">Presentación</a></li>
        <li><a href="https://web.ua.es/es/ua-estudios/grados-oficiales.html">Estudios</a></li>
        <li><a href="https://sa.ua.es">Alumnos</a></li>
        <li><a href="https://sd.ua.es">Deportes</a></li>
        <li><a href="https://web.ua.es/es/ua-organizacion/servicios.html">Servicios</a></li>
    </ul>
</body>
</html>
